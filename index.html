<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hero Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: kid mode = two giant choices, then a stage (video | task card side by side in landscape, stacked in portrait).
   Parent mode = a plain dashboard. One visual language: 👂 listen · 🎤 your turn · 💡 help · ⭐ did it · ▶ go on. */
:root{
  --bg:#EEF4FA; --card:#FFFFFF; --ink:#1B2340; --muted:#5A6587; --line:#1B2340; --shadow:#1B2340;
  --sun:#FFC93C; --mint:#2EC4A0; --berry:#FF5C7A; --sky:#4D9DFF; --soft:#DCE7F3; --hl:#FFE48A;
  --on-sun:#1B2340; --on-mint:#06281F;
  --c-new:#DCE7F3; --c-heard:#9CC7FF; --c-help:#FFC93C; --c-good:#6FD3BA; --c-strong:#FF8FA6;
  --f-display:"Baloo 2",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A; --card:#1B2442; --ink:#EEF2FF; --muted:#A7B1D3; --line:#05080F; --shadow:#05080F;
  --sun:#FFCF52; --mint:#3ED6B1; --berry:#FF7690; --sky:#6AAEFF; --soft:#26305A; --hl:#6B5A12;
  --c-new:#26305A; --c-heard:#3D6DB3; --c-help:#C99A1F; --c-good:#2A9C82; --c-strong:#C2546B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162A; --card:#1B2442; --ink:#EEF2FF; --muted:#A7B1D3; --line:#05080F; --shadow:#05080F;
  --sun:#FFCF52; --mint:#3ED6B1; --berry:#FF7690; --sky:#6AAEFF; --soft:#26305A; --hl:#6B5A12;
  --c-new:#26305A; --c-heard:#3D6DB3; --c-help:#C99A1F; --c-good:#2A9C82; --c-strong:#C2546B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.zh{font-family:var(--f-zh);color:var(--muted);font-size:14px;font-weight:400}

/* header */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:46px;height:46px;border-radius:14px;background:var(--sun);color:var(--on-sun);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:21px;transform:rotate(-4deg)}
.brand h1{font-size:28px;font-weight:800}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.navb{display:flex;align-items:center;gap:6px;padding:6px 14px;min-height:46px;border-radius:14px;background:var(--card);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);font-family:var(--f-display);font-weight:800;font-size:17px}
.navb[aria-current="true"]{background:var(--sun);color:var(--on-sun);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.lock{position:relative;min-width:46px;justify-content:center;font-size:20px;opacity:.75}
.lock .ring{position:absolute;inset:-3px;border-radius:14px;border:3px solid var(--mint);clip-path:inset(0 100% 0 0);transition:clip-path 1.8s linear}
.lock.holding .ring{clip-path:inset(0 0 0 0)}

.sticker{background:var(--card);border:3px solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 18px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-family:var(--f-display);font-weight:800;font-size:18px;text-decoration:none;color:var(--ink)}
.btn:active,.round:active,.choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.sun{background:var(--sun);color:var(--on-sun)} .btn.mint{background:var(--mint);color:var(--on-mint)} .btn.sky{background:var(--sky);color:#fff}
.btn.sm{min-height:42px;padding:4px 12px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lead{display:flex;flex-direction:column;gap:4px}
.lead h2{font-size:28px;font-weight:800}
.note{margin:0;color:var(--muted);font-size:15px}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{display:flex;flex-direction:column;gap:16px}

/* kid home */
.hello{display:flex;align-items:center;gap:16px;padding:16px 20px}
.hello .ava{font-size:64px}
.hello h2{font-size:clamp(28px,5vw,44px)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 16px;min-height:240px;border-radius:30px;text-align:center;position:relative}
.door .em{font-size:96px;line-height:1}
.door .go{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;border:4px solid var(--line);box-shadow:3px 3px 0 var(--shadow)}
.door.adv{background:var(--sun);color:var(--on-sun)} .door.adv .go{background:var(--card)}
.door.game{background:var(--sky);color:#fff} .door.game .go{background:var(--card);color:var(--ink)}
.door.book{background:var(--mint);color:var(--on-mint)} .door.book .go{background:var(--card);color:var(--ink)}
.door .pill.sun{background:var(--card);color:var(--ink)}

/* kid sub-pages */
.kidbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.round.nav{width:72px;height:72px;font-size:34px}
.tally{font-family:var(--f-display);font-weight:800;font-size:26px}
.showtabs{display:flex;gap:12px;flex-wrap:wrap}
.showtab{display:flex;align-items:center;gap:10px;padding:8px;border-radius:18px;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-family:var(--f-display);font-weight:800}
.showtab img{width:150px;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:2px solid var(--line);display:block}
.showtab[aria-current="true"]{background:var(--sun);color:var(--on-sun)}
.map{padding:26px 14px 18px;display:flex;flex-direction:column}
.mrow{display:flex;align-items:flex-start}
.mrow .conn{flex:1;min-width:8px;height:0;border-top:6px dashed var(--muted);margin-top:52px;opacity:.45}
.mrow .conn.off{visibility:hidden}
.turn{display:flex;height:34px}
.turn i{display:block;height:100%;border-left:6px dashed var(--muted);opacity:.45}
.turn.r{justify-content:flex-end;padding-right:52px} .turn.l{justify-content:flex-start;padding-left:52px}
.stopw{width:110px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.stop{width:104px;height:104px;border-radius:50%;border:4px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;font-size:48px;position:relative}
.stop .n{position:absolute;top:-8px;left:-8px;width:32px;height:32px;border-radius:50%;background:var(--sky);color:#fff;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.stop.done{background:var(--sun)}
.stop.done::after{content:"⭐";position:absolute;bottom:-12px;right:-12px;font-size:30px}
.stop.next{background:var(--mint);animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.stopw .mini{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;font-size:17px;line-height:1}
.stopw .lbl{font-size:12px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1}
.pages{display:flex;gap:10px;flex-wrap:wrap}
.page{width:78px;height:78px;border-radius:20px;font-size:40px;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center}
.page[aria-current="true"]{background:var(--sun);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px;padding:22px}
.stk{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0}
.stk .disc{width:108px;height:108px;max-width:100%;border-radius:50%;border:4px solid var(--line);display:grid;place-items:center;font-size:54px;box-shadow:3px 3px 0 var(--shadow);position:relative}
.stk.unseen .disc{background:var(--soft);border-style:dashed;box-shadow:none}
.stk.unseen .disc .e{filter:grayscale(1);opacity:.3}
.stk .disc .b{position:absolute;bottom:-10px;right:-10px;font-size:30px}
.stk .t{font-size:12px;font-weight:800;color:var(--muted);text-align:center;line-height:1.15}
.acts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.round.mic2{background:var(--berry)}
.chibi{display:block;width:100%;height:100%;overflow:visible}
.stk .disc svg{width:100px;height:100px}
.stk .disc{overflow:visible}
.stk.unseen .disc svg{filter:brightness(0) opacity(.18)}
.stk .disc .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--muted)}
.stk .disc .pe{position:absolute;bottom:-8px;left:-8px;width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:22px}
.stk .nm{font-family:var(--f-display);font-weight:800;font-size:14px;text-align:center;line-height:1.1}
.bigchibi{width:min(190px,48vw);height:auto;aspect-ratio:120/124;background:none;border:0;padding:0}
.bigchibi.sil svg{filter:brightness(0) opacity(.2)}
.door .friend{width:112px;height:116px}
.reward{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,32px)}
.guide{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.guide .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.guide h3{font-size:20px}
.guide ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:16px;font-weight:700}
.guide li{display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.guide li .i{font-size:22px;width:30px;flex:none;text-align:center;line-height:1.1}
.tip{margin:0;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:700;text-align:center;color:var(--ink);line-height:1.35}
.door[data-off]{filter:grayscale(.7);opacity:.6}
.door .pill{position:absolute;top:14px;right:14px;background:var(--berry);color:#fff;border:3px solid var(--line);border-radius:999px;padding:2px 12px;font-family:var(--f-display);font-weight:800;font-size:20px}

/* stage */
.stage{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,3fr) minmax(320px,2fr)}}
.vidcol{display:flex;flex-direction:column;gap:8px;padding:10px}
.vid{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:3px solid var(--line);background:#000}
.vid iframe,.vid #ytplayer{position:absolute;inset:0;width:100%;height:100%}
.vctl{display:flex;gap:8px;align-items:center;justify-content:space-between}
.card{display:flex;flex-direction:column;gap:12px;padding:16px;min-height:360px}
.chead{display:flex;justify-content:space-between;align-items:center}
.stars{font-size:22px;letter-spacing:2px}
.cbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.pic{font-size:96px;line-height:1;background:none;border:0;padding:0}
.hint{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:56px}
.hint span{font-size:48px}
.cfoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.cfoot .l{justify-self:start} .cfoot .r{justify-self:end}
.round{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:42px;border:4px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:var(--card)}
.round.go{background:var(--sun)} .round.star{background:var(--mint)} .round.help{background:var(--card);width:72px;height:72px;font-size:34px}
.round.ear{background:var(--sky)}
.mic{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:56px;background:var(--berry);border:4px solid var(--line);transition:transform .08s}
.mic.heard{box-shadow:0 0 0 10px color-mix(in srgb,var(--berry) 35%,transparent)}
.answer{font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}
.answer b{font-family:var(--f-display)}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.choice{width:110px;height:110px;border-radius:24px;display:grid;place-items:center;font-size:58px;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow)}
.choice.right{background:var(--mint)}
.choice.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.talking{animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}
.win{animation:winpop .9s ease-out}
@keyframes winpop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.count{display:flex;gap:8px;justify-content:center}
.count i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--soft)}
.count i.on{background:var(--sky)}

/* parent */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.box{padding:16px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:22px}
.scene{display:flex;flex-direction:column;gap:6px;padding:14px;text-align:left;position:relative}
.scene .em{font-size:36px;line-height:1}
.scene h3{font-size:20px}
.scene .done{position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--on-mint);border:2px solid var(--line);display:grid;place-items:center;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 6px;border-radius:11px;border:2px solid var(--line);font-size:19px}
.k-new{background:var(--c-new)} .k-heard{background:var(--c-heard)} .k-help{background:var(--c-help)} .k-good{background:var(--c-good)} .k-strong{background:var(--c-strong)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;font-weight:800;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:16px;border-radius:5px;border:2px solid var(--line)}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;border:3px solid var(--line);font-size:14px;font-weight:800;text-align:center}
.ptile .em{font-size:32px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px;align-items:center;font-weight:800;font-size:15px}
.bar .track{display:flex;height:22px;border-radius:8px;overflow:hidden;border:2px solid var(--line);background:var(--c-new)}
.bar .track i{display:block;height:100%}
@media (max-width:480px){.bar{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px}
.li .em{font-size:28px}
.li b{font-family:var(--f-display);font-size:19px}
.hist{display:flex;gap:3px;flex-wrap:wrap}
.hist i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.r0{background:var(--mint)} .r1{background:var(--sun)} .r2{background:var(--berry)}
.form{padding:20px;display:flex;flex-direction:column;gap:14px}
.form label{font-weight:800}
.form input,.form textarea,.form select{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.form textarea{min-height:130px;resize:vertical;font-size:14px}
.switch{display:flex;align-items:center;gap:10px;font-weight:800}
.switch input{width:24px;height:24px}
ol.how{margin:0;padding-left:22px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.status{margin:0;min-height:1.4em;font-size:15px}
.status.err{color:var(--berry);font-weight:800}
.warn{padding:14px 16px;border-color:var(--berry)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;transition:.25s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.burst{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;font-size:140px;z-index:15;opacity:0}
.burst.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.stop.next,.talking,.choice.wrong,.burst.go,.win{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">Hi</div><h1>Hero Words</h1></div>
    <nav class="nav" id="nav"></nav>
  </header>
  <section id="stage" class="stage" hidden>
    <div class="sticker vidcol">
      <div class="vid"><div id="ytplayer"></div></div>
      <div class="vctl"><button class="btn sm" id="homeBtn" aria-label="Home">🏠</button><button class="btn sm" id="pauseBtn" aria-label="Play or pause">⏸</button></div>
      <p class="note" id="ytNote"></p>
    </div>
    <div class="sticker card" id="card"></div>
  </section>
  <main id="view" class="panel" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="burst" id="burst" aria-hidden="true">🌟</div>

<script>
/* ===================== curriculum ===================== */
const MODULES=[
  {id:"needs",title:"I Need",emoji:"🙋",zh:"表達需求"},
  {id:"play",title:"Play Together",emoji:"🤝",zh:"社交合作"},
  {id:"feel",title:"Feelings",emoji:"😊",zh:"表達感受"},
  {id:"fix",title:"Fix Problems",emoji:"🛠️",zh:"解決衝突"},
  {id:"ask",title:"Ask & Care",emoji:"❓",zh:"提問與關心"}
];
const V1="t4pZwMW-FEw";
const PACK={
 chunks:[
  {id:"want-to",cue:"I want…",m:"needs",en:"I want to ___!",ex:"I want to play!",zh:"我想要…！",emoji:"🙋",move:["👉","Point to yourself, then reach out"],home:"Before playing: “I want to play blocks!”",alt:["I want ___!"],hero:{e:"🕷️🛝",say:"Spidey asks you: what do you want to do?",win:"🛝",winSay:"Wheee! Have fun!"}},

/* ===================== data store ===================== */
const LS="hero-words-v4";
let CH={},EPS=[],SRC={};
let M={},H={},DONE={},CUSTOM={chunks:[],episodes:[]};
const P={voice:"",speed:1,zh:false,mic:true,answer:true,tips:true,gclosed:{}};
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||"{}");M=d.mem||{};H=d.help||{};DONE=d.done||{};CUSTOM=d.custom||CUSTOM;Object.assign(P,d.prefs||{});}catch(e){}}
function save(){try{localStorage.setItem(LS,JSON.stringify({mem:M,help:H,done:DONE,custom:CUSTOM,prefs:P}));}catch(e){toast("Could not save on this device");}}
function buildIndex(){
  CH={};EPS=[];SRC={};
  for(const c of [...PACK.chunks,...CUSTOM.chunks])CH[c.id]=c;
  const seen=new Set();for(const ep of [...PACK.episodes,...CUSTOM.episodes]){if(seen.has(ep.id))continue;seen.add(ep.id);EPS.push(ep);}
  for(const ep of EPS)for(const sc of ep.scenes)for(const st of sc.stops)for(const ln of st.lines)
    (SRC[ln.c]=SRC[ln.c]||[]).push({...ln,v:ep.videoId,ep:ep.id,sc:sc.id,scStart:sc.start});
  for(const c of Object.values(CH))for(const x of (c.extra||[]))(SRC[c.id]=SRC[c.id]||[]).push(x);
}

/* ===================== scheduling: driven by the recall result =====================
   level 0 = said it with no help (green)  -> interval grows
   level 1-3 = said it after picture / move / first sound (yellow) -> back tomorrow, goes to the help list
   level 4 = needed the full model (red)   -> re-teach next time (listen first), help list            */
function today(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
let REW=[];
function exposed(id){const m=M[id];if(!m){M[id]={intro:today(),exp:1,iv:0,due:today(1),streak:0,att:[],best:1};REW.push({id,t:"new"});}else{m.exp=(m.exp||0)+1;}save();}
const TIER_RANK={good:2,strong:3};
function tierOf(id){const m=M[id];if(!m)return"sil";const b=Math.max(m.best||1,TIER_RANK[kind(id)]||1);return b>=3?"star":b===2?"cape":"base";}
function recallReady(id){const m=M[id];return !!(m&&m.intro<today()&&!m.reteach);}
function recordRecall(id,level,ctx,counts){
  const m=M[id]||(M[id]={intro:today(),exp:0,iv:0,due:today(),streak:0,att:[]});
  m.att=[...(m.att||[]),[today(),ctx,level]].slice(-40);
  if(!counts){save();return;}           // a retry inside the same session is practice only
  const before=m.best||1;
  if(level===0){m.streak=(m.streak||0)+1;m.iv=Math.min(60,Math.max(2,Math.round((m.iv||1)*(m.streak>=2?2.5:2))));m.due=today(m.iv);m.reteach=false;
    if(H[id]){H[id].greens=(H[id].greens||0)+1;H[id].due=today(3);if(H[id].greens>=2)delete H[id];}}
  else{m.streak=0;m.iv=1;m.due=today(1);if(level>=4)m.reteach=true;
    H[id]={since:(H[id]&&H[id].since)||today(),due:today(1),level:Math.max(level,(H[id]&&H[id].level)||0),greens:0};}
  const now=TIER_RANK[kind(id)]||1;if(now>before){m.best=now;REW.push({id,t:now===3?"star":"cape"});}
  save();
}
function kind(id){const m=M[id];if(!m)return"new";if(H[id])return"help";if(!m.att||!m.att.length)return"heard";return m.streak>=2?"strong":m.streak>=1?"good":"help";}
const KINDS=[["new","New"],["heard","Heard"],["help","Needs help"],["good","Said it"],["strong","Strong"]];
function dueRecall(){const t=today();return Object.keys(M).filter(id=>CH[id]&&M[id].due<=t&&(recallReady(id)||M[id].reteach));}
function dueHelp(){const t=today();return Object.keys(H).filter(id=>CH[id]&&H[id].due<=t);}

/* ===================== voice ===================== */
function enVoices(){return"speechSynthesis"in window?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)):[];}
function scoreVoice(v){let s=0;const n=v.name;if(/natural|neural/i.test(n))s+=60;if(/premium/i.test(n))s+=55;if(/enhanced/i.test(n))s+=45;if(/online/i.test(n))s+=10;
  if(/google us english/i.test(n))s+=25;if(/en[-_]US/i.test(v.lang))s+=12;if(/\bAna\b/i.test(n))s+=8;if(/samantha|ava|zoe|jenny|aria/i.test(n))s+=6;
  if(/compact|espeak|novelty|bells|bubbles|bad news|whisper|zarvox|trinoids|cellos|organ|boing|jester|superstar|wobble|albert|bahh/i.test(n))s-=80;return s;}
function bestVoices(){return enVoices().sort((a,b)=>scoreVoice(b)-scoreVoice(a));}
function mainVoice(){const vs=bestVoices();return vs.find(v=>v.name===P.voice)||vs[0]||null;}
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=()=>{if(S.view==="settings")render();};speechSynthesis.getVoices();}
let speakTok=0;
function speak(text,opt={}){return new Promise(res=>{
  if(!("speechSynthesis"in window)||!text)return res();
  const tok=++speakTok;speechSynthesis.cancel();pauseVideo();
  const u=new SpeechSynthesisUtterance(text);const v=mainVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-US";
  u.rate=Math.max(.5,Math.min(1.5,.95*P.speed*(opt.slow?.75:1)));u.pitch=1.08;
  const a=opt.ava;u.onstart=()=>{if(tok===speakTok&&a)a.classList.add("talking");};
  const done=()=>{if(a)a.classList.remove("talking");res();};u.onend=done;u.onerror=done;
  setTimeout(()=>{if(tok===speakTok)speechSynthesis.speak(u);else res();},60);});}
function hush(){speakTok++;if("speechSynthesis"in window)speechSynthesis.cancel();}

/* ===================== sound fx ===================== */
let actx=null;
function sfx(k){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const seq={tap:[[520,.05]],right:[[660,.09],[880,.12]],wrong:[[220,.16]],star:[[523,.08],[659,.08],[784,.08],[1047,.2]],hint:[[440,.07],[550,.07]]}[k]||[[600,.05]];
  let t=actx.currentTime;for(const[f,d]of seq){const o=actx.createOscillator(),g=actx.createGain();o.type=k==="wrong"?"triangle":"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.9;}}catch(e){}}

/* ===================== mic: shows the child was heard (no scoring) ===================== */
let micStream=null,micRAF=0,micAn=null;
async function micOn(el){
  micOff();if(!P.mic||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  try{micStream=micStream&&micStream.active?micStream:await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")await actx.resume();
    const src=actx.createMediaStreamSource(micStream);micAn=actx.createAnalyser();micAn.fftSize=512;src.connect(micAn);
    const buf=new Uint8Array(micAn.fftSize);let loud=0;
    const loop=()=>{if(!document.body.contains(el)){micOff();return;}micAn.getByteTimeDomainData(buf);let sum=0;for(const b of buf){const x=(b-128)/128;sum+=x*x;}
      const rms=Math.sqrt(sum/buf.length);el.style.transform=`scale(${1+Math.min(.35,rms*4)})`;
      if(rms>.06){loud++;if(loud>6)el.classList.add("heard");}else loud=Math.max(0,loud-1);
      micRAF=requestAnimationFrame(loop);};loop();
  }catch(e){P.mic=false;save();}
}
function micOff(full){cancelAnimationFrame(micRAF);micRAF=0;if(full&&micStream){try{micStream.getTracks().forEach(t=>t.stop());}catch(e){}micStream=null;}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1900);}
function celebrate(icon="🌟"){const b=$("#burst");b.textContent=icon;b.classList.remove("go");void b.offsetWidth;b.classList.add("go");sfx("star");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sayOf(c){return c.ex||c.en.replace(/\s*___\s*/," ");}
function cueOf(c){if(c.cue)return c.cue;const w=sayOf(c).replace(/^(Oh|Hey|Uh-oh|Huh),?\s+/i,"$1, ").split(/\s+/);return w.length>1?w[0].replace(/[,!.?]$/,"")+"…":w[0].slice(0,2)+"…";}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let FLOW=0;function newFlow(){FLOW++;return FLOW;}

/* ===================== YouTube player ===================== */
let YTP=null,ytReady=false,ytVid=null,seg=null,timer=null,pending=[];
function loadYT(){
  if(location.protocol==="file:")$("#ytNote").textContent="⚠️ Videos only play from a web address (http/https).";
  if(window.YT&&window.YT.Player){initPlayer();return;}
  if(document.getElementById("ytapi"))return;
  window.onYouTubeIframeAPIReady=initPlayer;const sc=document.createElement("script");sc.id="ytapi";sc.src="https://www.youtube.com/iframe_api";
  sc.onerror=()=>{$("#ytNote").textContent="⚠️ Could not load YouTube. Check the internet and reload.";};document.head.appendChild(sc);
}
function noCaptions(){try{YTP.unloadModule("captions");YTP.unloadModule("cc");}catch(e){}}
function initPlayer(){
  if(YTP)return;ytVid=EPS[0]?EPS[0].videoId:V1;
  const vars={playsinline:1,rel:0,modestbranding:1,controls:1,cc_load_policy:0,iv_load_policy:3};
  if(/^https?:/.test(location.protocol))vars.origin=location.origin;
  YTP=new YT.Player("ytplayer",{videoId:ytVid,playerVars:vars,events:{
    onReady:()=>{ytReady=true;noCaptions();const p=pending;pending=[];p.forEach(f=>f());},
    onError:e=>{$("#ytNote").innerHTML=`⚠️ This video can't play here (error ${esc(e.data)}). <a href="https://www.youtube.com/watch?v=${encodeURIComponent(ytVid)}" target="_blank" rel="noopener">Open on YouTube</a>`;},
    onStateChange:e=>{$("#pauseBtn").textContent=e.data===1?"⏸":"▶";if(e.data===1)noCaptions();}}});
}
function whenReady(fn){if(YTP&&ytReady)fn();else{pending.push(fn);loadYT();}}
function pauseVideo(){if(YTP&&ytReady)try{if(YTP.getPlayerState()===1)YTP.pauseVideo();}catch(e){}}
function stopVideo(){clearInterval(timer);timer=null;seg=null;pauseVideo();}
function startAt(v,s){if(ytVid!==v){ytVid=v;YTP.loadVideoById({videoId:v,startSeconds:s});}else{YTP.seekTo(s,true);YTP.playVideo();}}
function runTimer(){clearInterval(timer);timer=setInterval(tick,150);}
/* play a stretch; resolves when it reaches the end (or when replaced) */
function playRange(v,s,e,flow){return new Promise(res=>whenReady(()=>{hush();if(seg&&seg.res)seg.res(false);seg={kind:"range",e,res,flow};startAt(v,Math.max(0,s));runTimer();}));}
function playLine(src,flow){return src?playRange(src.v,src.s-.15,src.e+.35,flow):Promise.resolve(true);}
/* play a scene with events (pause points) */
function playScene(ep,from,to,events,onEvent,flow){return new Promise(res=>whenReady(()=>{hush();if(seg&&seg.res)seg.res(false);
  seg={kind:"scene",e:to,events,next:0,onEvent,res,flow,v:ep.videoId};startAt(ep.videoId,from);runTimer();}));}
function tick(){
  if(!seg||!YTP)return;let t;try{t=YTP.getCurrentTime();}catch(e){return;}
  if(YTP.getPlayerState()!==1)return;
  if(seg.flow!==FLOW){stopVideo();return;}
  if(seg.kind==="scene"&&seg.next<seg.events.length&&t>=seg.events[seg.next].t-.12){
    YTP.pauseVideo();clearInterval(timer);const ev=seg.events[seg.next++];const saved=seg;seg=null;
    saved.onEvent(ev).then(()=>{if(saved.flow!==FLOW)return;whenReady(()=>{seg=saved;startAt(saved.v,ev.resume);runTimer();});});return;}
  if(t>=seg.e-.1){YTP.pauseVideo();clearInterval(timer);const r=seg.res;seg=null;r&&r(true);}
}
$("#pauseBtn").onclick=()=>{if(!YTP||!ytReady)return;if(YTP.getPlayerState()===1)YTP.pauseVideo();else YTP.playVideo();};
$("#homeBtn").onclick=()=>goBack();

async function runScene(ep,sc,flow){
  tipped(TIPS.start,`<div class="cbody"><div class="pic">${esc(sc.emoji)}</div><h2>${esc(sc.title)}</h2></div><div class="cfoot"><span></span><span></span><button class="round go r" id="sGo" aria-label="Watch">▶</button></div>`);
  await new Promise(r=>$("#sGo").onclick=()=>{sfx("tap");r();});if(flow!==FLOW)return;
  // build events: known phrases freeze BEFORE the line (recall); new phrases pause AFTER the line (listen)
  const events=[];
  for(const st of sc.stops){const newLines=[];
    for(const ln of st.lines){const inScene=ln.s>=sc.start&&ln.s<=sc.end;const src={...ln,v:ep.videoId};
      if(inScene&&recallReady(ln.c))events.push({t:ln.s-.05,type:"recall",ln,src,resume:ln.s-.1});
      else newLines.push({ln,src});}

async function sceneEvent(ev,flow){
  if(ev.type==="recall"){
    const c=CH[ev.ln.c];
    const lvl=await recallCard(c,ev.src,{say:ev.ln.say,q:ev.ln.q,pic:charPic(ev.ln.who),tag:"Your turn"},flow);
    if(flow!==FLOW)return;recordRecall(c.id,lvl,"scene",true);
    STAR++;celebrate(lvl===0?"🌟":"⭐");card(`<div class="cbody"><div class="pic win">${lvl===0?"🌟":"⭐"}</div></div>`);
    await speak(lvl===0?"Yes! Let's hear it!":"Good! Let's hear it!");return;   // resume plays the real line = feedback
  }
  if(ev.note){await goCard("💡",ev.note,flow);if(flow!==FLOW)return;}
  for(let i=0;i<ev.lines.length;i++){const{ln,src}=ev.lines[i];const c=CH[ln.c];if(!c)continue;
    if(i===0&&ev.check&&!M[c.id]){await checkCard(ev.check,flow);if(flow!==FLOW)return;}
    await listenCard(c,src,flow);if(flow!==FLOW)return;
    if(M[c.id]&&M[c.id].reteach)M[c.id].reteach=false;exposed(c.id);}
}

/* ===================== FREEZE & SPEAK: stop right before the line ===================== */
async function freezeAndSpeak(id,flow,o={}){
  const c=CH[id];const srcs=SRC[id]||[];if(!c)return;
  const src=srcs.length?srcs[Math.floor(Math.random()*srcs.length)]:null;
  if(M[id]&&M[id].reteach){await listenCard(c,src,flow);if(flow!==FLOW)return;M[id].reteach=false;save();}
  if(src&&src.say){
    tipped(TIPS.watch,`<div class="cbody"><div class="pic talking">👀</div></div>`);
    const base=(src.scStart!=null&&src.scStart<=src.s)?src.scStart:src.s-8;const from=Math.max(base,src.s-8);
    await playRange(src.v,from,src.s-.05,flow);if(flow!==FLOW)return;
  }
  const lvl=await recallCard(c,src,{say:src&&src.say,q:src&&src.q,pic:src?charPic(src.who):c.emoji,tag:o.tag||"Freeze & Speak"},flow);
  if(flow!==FLOW)return;recordRecall(id,lvl,"freeze",o.counts!==false);
  await praise(lvl,c,src,flow,true);return lvl;
}

/* ===================== HERO CHALLENGE: 5-6 recalls, failed ones come back after one other ===================== */
async function startChallenge(){
  const flow=newFlow();STAR=0;openStage("home");
  const ready=Object.keys(M).filter(id=>CH[id]&&(recallReady(id)||M[id].reteach));
  const help=dueHelp(),due=dueRecall().filter(id=>!help.includes(id));
  const rest=shuffle(ready.filter(id=>!help.includes(id)&&!due.includes(id))).sort((a,b)=>(M[a].due<M[b].due?-1:1));
  let pick=[...help,...due,...rest].filter((v,i,a)=>a.indexOf(v)===i).slice(0,6);
  pick=interleave(pick);
  await goCard("🎮",help.length?"Hero Challenge! Let's practice the tricky ones.":"Hero Challenge! Let's go!",flow);if(flow!==FLOW)return;
  const queue=pick.map((id,i)=>({id,game:(i%2===0&&(SRC[id]||[]).length)?"freeze":"hero",counts:true}));
  for(let i=0;i<queue.length;i++){const q=queue[i];
    const lvl=q.game==="freeze"?await freezeAndSpeak(q.id,flow,{counts:q.counts}):await helpTheHero(q.id,flow,{counts:q.counts});
    if(flow!==FLOW)return;
    if(lvl>=3&&q.counts){queue.splice(Math.min(i+2,queue.length),0,{id:q.id,game:q.game==="freeze"?"hero":"freeze",counts:false});}}
  await showRewards(flow);if(flow!==FLOW)return;
  celebrate("🏆");
  tipped(TIPS.challengeEnd,`<div class="cbody"><div class="pic win">🏆</div><div class="stars">${"⭐".repeat(Math.min(STAR,12))}</div></div>
    <div class="cfoot"><span></span><span></span><button class="round go r" id="eHome" aria-label="Home">🏠</button></div>`);
  speak("You are a super hero! Great job!");$("#eHome").onclick=()=>goKid();
}
function interleave(ids){const by={};for(const id of ids)(by[CH[id].m]=by[CH[id].m]||[]).push(id);const out=[];let more=true;
  while(more){more=false;for(const k of Object.keys(by)){const x=by[k].shift();if(x){out.push(x);more=true;}}}return out;}

function srtText(raw){return String(raw).replace(/\r/g,"").split(/\n\n+/).map(b=>{const l=b.split("\n").filter(Boolean);const ti=l.findIndex(x=>x.includes("-->"));if(ti<0)return"";
  const tx=l.slice(ti+1).join(" ").trim();if(!tx||/^\[[^\]]*\]$/.test(tx)||/♪/.test(tx))return"";
  const p=x=>{const m=x.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);return m?(+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000):0;};const[a,b2]=l[ti].split("-->");

     "lines":[{"c":"chunk-id","s":seconds,"e":seconds,"who":"speaker","text":"exact subtitle line","say":"one easy sentence setting up the moment BEFORE the line, without giving the answer","q":"What can he/she/they say?"}]}]}]},
 "chunks":[{"id":"kebab-id","m":"needs|play|feel|fix|ask","en":"the chunk (use ___ for a swappable slot)","ex":"example if en has ___","zh":"Traditional Chinese (Taiwan)","emoji":"one picture emoji","move":["emoji","short hand-movement instruction"],"home":"when to use it at home","alt":["other answers that get the same message across"],"hero":{"e":"1-2 emoji scene","say":"a tiny story moment where a hero needs the child to say this chunk (do not say the chunk)","win":"emoji","winSay":"what happens next, happy ending"}}]}
Rules: s/e copied exactly from the subtitles; "at" = e of the last line in that stop + 0.05; 1–2 stops per scene; "check" optional, answerable with pictures; "chunks" contains only NEW chunks; keep natural idioms; zh in Traditional Chinese.

Subtitles:
${srt}`;
}
function vAdd(v){
  v.innerHTML=`<div class="lead"><span class="eyebrow">For grown-ups</span><h2>Add a show</h2><p class="note">New phrases join the same phrase map. Phrases you already have get more clips, so practice uses more examples.</p></div>
  <section class="sticker form">
    <ol class="how"><li>Download the English subtitles (.srt) with DownSub or yt-dlp.</li>
      <li>Paste the YouTube link, pick the .srt file, tap <b>Copy prompt</b>.</li>
      <li>Paste it into a Claude chat and send. Copy Claude's JSON answer, paste it below, tap <b>Add show</b>.</li></ol>
    <div><label for="ytUrl">YouTube link</label><input id="ytUrl" placeholder="https://youtu.be/..." inputmode="url"></div>
    <div><label for="srtFile">Subtitles (.srt)</label><input type="file" id="srtFile" accept=".srt,.txt,.vtt"></div>
    <div class="row"><button class="btn sm" id="copyPrompt">📋 Copy prompt</button></div>
    <div><label for="jsonIn">Claude's JSON answer</label><textarea id="jsonIn" placeholder='{"episode": {...}, "chunks": [...]}'></textarea></div>
    <div class="row"><button class="btn sun" id="addShow">✨ Add show</button></div>
    <p class="status" id="st"></p>
  </section>
  ${CUSTOM.episodes.length?`<div class="lead"><h2>Added shows</h2></div><section class="sticker form">${CUSTOM.episodes.map(e=>`<div class="row" style="justify-content:space-between"><b>${esc(e.title)}</b><button class="btn sm" data-del="${esc(e.id)}">${S.del===e.id?"Delete?":"✕"}</button></div>`).join("")}</section>`:""}`;
  let srt="";const st=$("#st");
  $("#srtFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{srt=srtText(r.result);toast(`Subtitles loaded: ${srt.split("\n").length} lines`);};r.readAsText(f);};
  $("#copyPrompt").onclick=async()=>{st.classList.remove("err");const vid=videoIdOf($("#ytUrl").value);
    if(!vid){st.textContent="Paste the YouTube link first.";st.classList.add("err");return;}
    if(!srt){st.textContent="Pick the .srt file first.";st.classList.add("err");return;}
    const text=genPrompt(vid,srt);try{await navigator.clipboard.writeText(text);st.textContent="Prompt copied. Paste it into Claude.";}catch(e){$("#jsonIn").value=text;$("#jsonIn").select();st.textContent="Copy the text in the box, then replace it with Claude's answer.";}};
  $("#addShow").onclick=()=>{st.classList.remove("err");let raw=$("#jsonIn").value.trim();const fence=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)raw=fence[1];
    try{const d=JSON.parse(raw.slice(raw.indexOf("{"),raw.lastIndexOf("}")+1));const r=importPack(d);st.textContent=`Added “${r.title}”: ${r.scenes} scenes, ${r.newChunks} new phrases.`;celebrate("🎬");}
    catch(e){st.textContent="That answer couldn't be read: "+(e.message||"check the JSON")+".";st.classList.add("err");}};
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(S.del!==id){S.del=id;vAdd(v);return;}CUSTOM.episodes=CUSTOM.episodes.filter(e=>e.id!==id);S.del=null;save();buildIndex();vAdd(v);});
}
function importPack(d){
  const ep=d.episode;if(!ep||!Array.isArray(ep.scenes)||!ep.scenes.length)throw new Error("no scenes");
  const vid=videoIdOf(ep.videoId||ep.id)||videoIdOf(($("#ytUrl")||{}).value||"");if(!vid)throw new Error("missing video id");
  const num=x=>{const n=+x;if(!Number.isFinite(n))throw new Error("bad time");return n;};const str=x=>String(x??"");
  let newC=0;
  for(const c of (d.chunks||[])){if(!c||!c.id||!c.en||CH[c.id])continue;
    CUSTOM.chunks.push({id:str(c.id),m:MODULES.some(m=>m.id===c.m)?c.m:"play",en:str(c.en),ex:c.ex?str(c.ex):undefined,zh:str(c.zh),emoji:str(c.emoji)||"💬",
      move:Array.isArray(c.move)?[str(c.move[0])||"👋",str(c.move[1])]:["👋","Make a big gesture"],home:str(c.home),alt:Array.isArray(c.alt)?c.alt.map(str):[],
      hero:c.hero&&c.hero.say?{e:str(c.hero.e)||"🦸",say:str(c.hero.say),win:str(c.hero.win)||"🎉",winSay:str(c.hero.winSay)||"Hooray!"}:undefined});newC++;}
  buildIndex();
  const scenes=ep.scenes.map((sc,i)=>({id:"s"+(i+1),title:str(sc.title)||"Scene "+(i+1),emoji:str(sc.emoji)||"🎬",start:num(sc.start),end:num(sc.end),
    stops:(sc.stops||[]).map(s=>({at:num(s.at),note:s.note?str(s.note):undefined,
      check:s.check&&Array.isArray(s.check.o)&&s.check.o.length>1?{q:str(s.check.q),o:s.check.o.map(o=>[str(o[0]),str(o[1])]),a:+s.check.a||0}:undefined,
      lines:(s.lines||[]).filter(l=>l&&CH[l.c]).map(l=>({c:str(l.c),s:num(l.s),e:num(l.e),who:str(l.who),text:str(l.text),say:str(l.say),q:str(l.q)||"What can you say?"}))})).filter(s=>s.lines.length).sort((a,b)=>a.at-b.at)})).filter(sc=>sc.stops.length);
  if(!scenes.length)throw new Error("no usable scenes");
  CUSTOM.episodes=CUSTOM.episodes.filter(e=>e.id!==vid);CUSTOM.episodes.push({id:vid,videoId:vid,title:str(ep.title)||"New show",scenes});
  save();buildIndex();return{title:str(ep.title)||"New show",scenes:scenes.length,newChunks:newC};
}

let rsT;addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(S.mode==="kid"&&S.view==="map")render();},250);});
/* ===================== boot ===================== */
load();buildIndex();render();
</script>
