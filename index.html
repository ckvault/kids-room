<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hero Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: sticker-book app. Header nav, a persistent video stage, then one task card at a time. Single column on phones. */
:root{
  --bg:#EEF4FA; --card:#FFFFFF; --ink:#1B2340; --muted:#5A6587; --line:#1B2340; --shadow:#1B2340;
  --sun:#FFC93C; --mint:#2EC4A0; --berry:#FF5C7A; --sky:#4D9DFF; --soft:#DCE7F3; --hl:#FFE48A;
  --on-sun:#1B2340; --on-mint:#06281F;
  --s0:#DCE7F3; --s1:#9CC7FF; --s2:#6FD3BA; --s3:#FFC93C; --s4:#FF8FA6;
  --f-display:"Baloo 2",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A; --card:#1B2442; --ink:#EEF2FF; --muted:#A7B1D3; --line:#05080F; --shadow:#05080F;
  --sun:#FFCF52; --mint:#3ED6B1; --berry:#FF7690; --sky:#6AAEFF; --soft:#26305A; --hl:#6B5A12;
  --s0:#26305A; --s1:#3D6DB3; --s2:#2A9C82; --s3:#C99A1F; --s4:#C2546B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162A; --card:#1B2442; --ink:#EEF2FF; --muted:#A7B1D3; --line:#05080F; --shadow:#05080F;
  --sun:#FFCF52; --mint:#3ED6B1; --berry:#FF7690; --sky:#6AAEFF; --soft:#26305A; --hl:#6B5A12;
  --s0:#26305A; --s1:#3D6DB3; --s2:#2A9C82; --s3:#C99A1F; --s4:#C2546B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.zh{font-family:var(--f-zh);color:var(--muted);font-size:14px;font-weight:400}
.words{font-family:var(--f-display);font-weight:800;color:var(--muted);font-size:18px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:48px;height:48px;border-radius:15px;background:var(--sun);color:var(--on-sun);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;transform:rotate(-4deg)}
.brand h1{font-size:30px;font-weight:800}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.navb{display:flex;align-items:center;gap:6px;padding:6px 14px;min-height:48px;border-radius:15px;background:var(--card);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);font-family:var(--f-display);font-weight:800;font-size:17px}
.navb[aria-current="true"]{background:var(--sun);color:var(--on-sun);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.navb.on{background:var(--mint);color:var(--on-mint)}
.badge{background:var(--berry);color:#fff;border-radius:999px;padding:0 8px;font-size:14px}

.sticker{background:var(--card);border:3px solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 20px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-family:var(--f-display);font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.sun{background:var(--sun);color:var(--on-sun)} .btn.mint{background:var(--mint);color:var(--on-mint)}
.btn.berry{background:var(--berry);color:#fff} .btn.sky{background:var(--sky);color:#fff}
.btn.sm{min-height:44px;padding:4px 14px;font-size:17px}
.btn.icon{min-width:52px;padding:4px 10px;font-size:24px}
.btn.big{min-height:70px;font-size:24px;padding:10px 28px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{justify-content:center}
.lead{display:flex;flex-direction:column;gap:4px}
.lead h2{font-size:30px;font-weight:800}
.note{margin:0;color:var(--muted);font-size:15px}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{display:flex;flex-direction:column;gap:16px}

/* player */
.stage{padding:12px;display:flex;flex-direction:column;gap:10px}
.pbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pbar h2{font-size:24px}
.vid{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:3px solid var(--line);background:#000}
.vid iframe,.vid #ytplayer{position:absolute;inset:0;width:100%;height:100%}
.pctl{display:flex;flex-wrap:wrap;gap:8px}
.btn.toggle.on{background:var(--mint);color:var(--on-mint)}

/* task card */
.task{padding:18px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.task h3{font-size:26px}
.bigem{font-size:84px;line-height:1}
.move{display:flex;gap:12px;align-items:center;padding:10px 16px;border-radius:16px;background:var(--soft);border:2px solid var(--line);font-weight:800;text-align:left}
.move .em{font-size:40px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--soft)}
.dots i.on{background:var(--mint)}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.pic{width:120px;height:120px;max-width:100%;display:grid;place-items:center;font-size:62px;border-radius:22px}
.pic.right{background:var(--mint)}
.pic.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.frame{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1.2;display:flex;flex-wrap:wrap;gap:.25em;justify-content:center;align-items:center}
.blank{display:inline-flex;align-items:center;gap:6px;min-width:2.4em;justify-content:center;border-bottom:5px solid var(--sky);padding:0 6px}
.blank.filled{background:var(--hl);border-radius:10px 10px 0 0}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-weight:800;font-size:13px;line-height:1.1}
.rate button span{font-size:30px}
@media (max-width:560px){.rate{grid-template-columns:repeat(3,1fr)}}
.ava{display:inline-block}
.talking{animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}

/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.scene{display:flex;flex-direction:column;gap:6px;padding:14px;text-align:left;position:relative}
.scene .em{font-size:40px;line-height:1}
.scene h3{font-size:21px}
.scene .done{position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--on-mint);border:2px solid var(--line);display:grid;place-items:center;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 6px;border-radius:12px;border:2px solid var(--line);font-size:20px}
.st0{background:var(--s0)} .st1{background:var(--s1)} .st2{background:var(--s2)} .st3{background:var(--s3)} .st4{background:var(--s4)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;font-weight:800;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:16px;height:16px;border-radius:5px;border:2px solid var(--line)}
.module{display:flex;flex-direction:column;gap:10px;padding:16px}
.module h3{font-size:24px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;border:3px solid var(--line);font-size:13px;font-weight:800;min-height:96px;justify-content:center}
.ptile .em{font-size:36px}
.ptile .lv{font-size:12px;opacity:.8}
.home{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.home .em{font-size:40px}
.home b{font-family:var(--f-display);font-size:22px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;font-weight:800;font-size:15px}
.bar .track{display:flex;height:22px;border-radius:8px;overflow:hidden;border:2px solid var(--line);background:var(--s0)}
.bar .track i{display:block;height:100%}
@media (max-width:480px){.bar{grid-template-columns:1fr}}

.form{padding:20px;display:flex;flex-direction:column;gap:14px}
.form label{font-weight:800}
.form input,.form textarea,.form select{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.form textarea{min-height:140px;resize:vertical;font-size:14px}
.switch{display:flex;align-items:center;gap:10px;font-weight:800}
.switch input{width:24px;height:24px}
ol.how{margin:0;padding-left:22px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.status{margin:0;min-height:1.4em;font-size:15px}
.status.err{color:var(--berry);font-weight:800}
.warn{padding:14px 16px;border-color:var(--berry)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;transition:.25s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.burst{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;font-size:130px;z-index:15;opacity:0}
.burst.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.talking,.pic.wrong,.burst.go{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">Hi</div><h1>Hero Words</h1></div>
    <nav class="nav" aria-label="Main">
      <button class="navb" data-nav="today">🏠 Today</button>
      <button class="navb" data-nav="shows">🎬 Shows</button>
      <button class="navb" data-nav="phrases">🧩 Phrases</button>
      <button class="navb" data-nav="review">🔁 Review <span class="badge" id="dueBadge" hidden>0</span></button>
      <button class="navb" data-nav="grown">⚙️</button>
      <button class="navb" id="wordsBtn" aria-pressed="false" title="Show words (for grown-ups)">👁 Words</button>
    </nav>
  </header>
  <section id="stage" class="sticker stage" hidden>
    <div class="pbar"><button class="btn sm" id="pBack">← Back</button><h2 id="pTitle"></h2></div>
    <div class="vid"><div id="ytplayer"></div></div>
    <div class="pctl">
      <button class="btn sm icon" id="pPause" aria-label="Play or pause">⏸</button>
      <button class="btn sm" id="pAgain">🔁 Again</button>
      <button class="btn sm toggle" id="pSlow">🐢 Slow</button>
    </div>
    <p class="note" id="ytNote"></p>
  </section>
  <main id="view" class="panel" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="burst" id="burst" aria-hidden="true">🌟</div>

/* ================= storage ================= */
const LS="hero-words-v3";
let CH={}, EPS=[], SRC={};
let M={}, DONE={}, CUSTOM={chunks:[],episodes:[]};
const P={voice:"",speed:1,zh:false,words:false};
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||"{}");M=d.mem||{};DONE=d.done||{};CUSTOM=d.custom||CUSTOM;Object.assign(P,d.prefs||{});}catch(e){}}
function save(){try{localStorage.setItem(LS,JSON.stringify({mem:M,done:DONE,custom:CUSTOM,prefs:P}));}catch(e){toast("Could not save on this device");}}
function buildIndex(){
  CH={};EPS=[];SRC={};
  for(const c of [...PACK.chunks,...CUSTOM.chunks])CH[c.id]=c;
  const seen=new Set();for(const ep of [...PACK.episodes,...CUSTOM.episodes]){if(seen.has(ep.id))continue;seen.add(ep.id);EPS.push(ep);}
  for(const ep of EPS)for(const sc of ep.scenes)for(const st of sc.stops)for(const ln of st.lines){(SRC[ln.c]=SRC[ln.c]||[]).push({v:ep.videoId,s:ln.s,e:ln.e,who:ln.who,text:ln.text,ep:ep.id,sc:sc.id});}
  for(const c of Object.values(CH))for(const x of (c.extra||[]))(SRC[c.id]=SRC[c.id]||[]).push(x);
}

/* ================= memory & review schedule ================= */
function today(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function mem(id){return M[id];}
function stOf(id){return M[id]?M[id].st:-1;}
function rate(id,r){
  const m=M[id]||{st:0,reps:0,hist:[]};const prev=M[id]?m.st:0;
  if(r>=prev){m.st=Math.max(prev,r);m.reps=(m.reps||0)+1;}else{m.st=Math.max(r,prev-1);m.reps=0;}
  const base=[1,1,2,3,5][m.st];const mult=Math.min(4,1+Math.floor(((m.reps||1)-1)/2));
  const days=(r===0||r<prev)?1:base*mult;
  m.due=today(days);m.last=today();m.hist=[...(m.hist||[]),[today(),r]].slice(-30);M[id]=m;save();renderNav();
}
function dueList(){const t=today();return Object.keys(M).filter(id=>CH[id]&&M[id].due<=t).sort((a,b)=>M[a].st-M[b].st||(M[a].due<M[b].due?-1:1));}

/* ================= voice (for questions & frames) ================= */
function enVoices(){return"speechSynthesis"in window?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)):[];}
function scoreVoice(v){let s=0;const n=v.name;if(/natural|neural/i.test(n))s+=60;if(/premium/i.test(n))s+=55;if(/enhanced/i.test(n))s+=45;if(/online/i.test(n))s+=10;
  if(/google us english/i.test(n))s+=25;if(/en[-_]US/i.test(v.lang))s+=12;if(/\bAna\b/i.test(n))s+=8;if(/samantha|ava|zoe|jenny|aria/i.test(n))s+=6;
  if(/compact|espeak|novelty|bells|bubbles|bad news|whisper|zarvox|trinoids|cellos|organ|boing|jester|superstar|wobble|albert|bahh/i.test(n))s-=80;return s;}
function bestVoices(){return enVoices().sort((a,b)=>scoreVoice(b)-scoreVoice(a));}
function mainVoice(){const vs=bestVoices();return vs.find(v=>v.name===P.voice)||vs[0]||null;}
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=()=>{if(S.view==="grown")render();};speechSynthesis.getVoices();}
let speakTok=0;
function speak(text,opt={}){return new Promise(res=>{
  if(!("speechSynthesis"in window)||!text){return res();}
  const tok=++speakTok;speechSynthesis.cancel();pauseVideo();
  const u=new SpeechSynthesisUtterance(text);const v=mainVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-US";
  u.rate=Math.max(.5,Math.min(1.5,.95*P.speed*(opt.slow?.7:1)));u.pitch=1.05;
  const a=opt.ava;u.onstart=()=>{if(tok===speakTok&&a)a.classList.add("talking");};
  const done=()=>{if(a)a.classList.remove("talking");res();};u.onend=done;u.onerror=done;
  setTimeout(()=>{if(tok===speakTok)speechSynthesis.speak(u);},60);});}

/* ================= sound fx ================= */
let actx=null;
function sfx(kind){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const seq={pop:[[660,.06]],tap:[[520,.05]],right:[[660,.09],[880,.12]],wrong:[[220,.18]],star:[[523,.08],[659,.08],[784,.08],[1047,.18]]}[kind]||[[600,.05]];
  let t=actx.currentTime;for(const[f,d]of seq){const o=actx.createOscillator(),g=actx.createGain();o.type=kind==="wrong"?"triangle":"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.9;}}catch(e){}}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1900);}
function celebrate(icon="🌟"){const b=$("#burst");b.textContent=icon;b.classList.remove("go");void b.offsetWidth;b.classList.add("go");sfx("star");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function W(text,cls="words"){return P.words&&text?`<div class="${cls}">${esc(text)}</div>`:"";}
function ZH(text){return P.words&&P.zh&&text?`<div class="zh">${esc(text)}</div>`:"";}
function say(c){return c.ex||c.en.replace(/\s*___\s*/," ");}
function findScene(epId,scId){const ep=EPS.find(e=>e.id===epId);return ep&&{ep,sc:ep.scenes.find(s=>s.id===scId)};}
function sceneKey(ep,sc){return ep.id+"/"+sc.id;}

/* ================= YouTube player ================= */
let YTP=null,ytReady=false,ytVid=null,seg=null,lastClip=null,timer=null,slow=false,pending=null;
function loadYT(){
  if(location.protocol==="file:")$("#ytNote").textContent="⚠️ Videos only play when this page is opened from a web address (http/https), not from a file.";
  if(window.YT&&window.YT.Player){initPlayer();return;}
  if(document.getElementById("ytapi"))return;
  window.onYouTubeIframeAPIReady=initPlayer;
  const sc=document.createElement("script");sc.id="ytapi";sc.src="https://www.youtube.com/iframe_api";
  sc.onerror=()=>{$("#ytNote").textContent="⚠️ Could not load YouTube. Check the internet and reload.";};document.head.appendChild(sc);
}
function noCaptions(){try{YTP.unloadModule("captions");YTP.unloadModule("cc");}catch(e){}}
function initPlayer(){
  if(YTP)return;ytVid=EPS[0]?EPS[0].videoId:V1;
  const vars={playsinline:1,rel:0,modestbranding:1,controls:1,cc_load_policy:0,iv_load_policy:3,disablekb:0};
  if(/^https?:/.test(location.protocol))vars.origin=location.origin;
  YTP=new YT.Player("ytplayer",{videoId:ytVid,playerVars:vars,events:{
    onReady:()=>{ytReady=true;noCaptions();if(pending){const p=pending;pending=null;p();}},
    onError:e=>{$("#ytNote").innerHTML=`⚠️ This video can't play here (error ${esc(e.data)}). <a href="https://www.youtube.com/watch?v=${encodeURIComponent(ytVid)}" target="_blank" rel="noopener">Open it on YouTube</a>.`;},
    onStateChange:e=>{$("#pPause").textContent=e.data===1?"⏸":"▶";if(e.data===1){noCaptions();try{YTP.setPlaybackRate(slow?.75:1);}catch(x){}}}}});
}
function whenReady(fn){if(YTP&&ytReady)fn();else{pending=fn;loadYT();}}
function pauseVideo(){if(YTP&&ytReady)try{if(YTP.getPlayerState()===1)YTP.pauseVideo();}catch(e){}}
function stopAll(){clearInterval(timer);timer=null;seg=null;pauseVideo();}
function startAt(v,s){if(ytVid!==v){ytVid=v;YTP.loadVideoById({videoId:v,startSeconds:s});}else{YTP.seekTo(s,true);YTP.playVideo();}}
function runTimer(){clearInterval(timer);timer=setInterval(tick,200);}
function playClip(v,s,e,onEnd){whenReady(()=>{speechSynthesis&&speechSynthesis.cancel();seg={kind:"clip",s:Math.max(0,s-.15),e:e+.35,onEnd};lastClip={v,s,e};startAt(v,seg.s);runTimer();});}
function playScene(ep,sc,fromT,nextStop,onStop,onEnd){whenReady(()=>{speechSynthesis&&speechSynthesis.cancel();
  seg={kind:"scene",s:sc.start,e:sc.end,stops:sc.stops,next:nextStop||0,onStop,onEnd};lastClip={v:ep.videoId,s:sc.start,e:sc.end,scene:true};
  startAt(ep.videoId,fromT??sc.start);runTimer();});}
function tick(){
  if(!seg||!YTP)return;let t;try{t=YTP.getCurrentTime();}catch(e){return;}
  if(YTP.getPlayerState()!==1)return;
  if(seg.kind==="scene"&&seg.next<seg.stops.length&&t>=seg.stops[seg.next].at-.12){
    YTP.pauseVideo();const i=seg.next;seg.next++;const saved=seg;seg=null;clearInterval(timer);saved.onStop&&saved.onStop(i,saved);return;}
  if(t>=seg.e-.12){YTP.pauseVideo();const cb=seg.onEnd;seg=null;clearInterval(timer);cb&&cb();}
}
function resumeScene(saved,at){whenReady(()=>{seg=saved;YTP.seekTo(at,true);YTP.playVideo();runTimer();});}
$("#pPause").onclick=()=>{if(!YTP||!ytReady)return;if(YTP.getPlayerState()===1)YTP.pauseVideo();else YTP.playVideo();};
$("#pAgain").onclick=()=>{if(!lastClip)return;if(lastClip.scene&&S.view==="scene"){startScene();return;}playClip(lastClip.v,lastClip.s,lastClip.e);};
$("#pSlow").onclick=()=>{slow=!slow;$("#pSlow").classList.toggle("on",slow);try{YTP.setPlaybackRate(slow?.75:1);}catch(e){}};
function playSource(src,onEnd){if(src)playClip(src.v,src.s,src.e,onEnd);}

/* ================= navigation ================= */
const S={view:"today",ep:null,sc:null,chunk:null};
let G={};
function go(view,extra){stopAll();speechSynthesis&&speechSynthesis.cancel();Object.assign(S,{view},extra||{});G={};render();window.scrollTo({top:0});}
function renderNav(){const n=dueList().length,b=$("#dueBadge");b.hidden=!n;b.textContent=n;
  document.querySelectorAll("[data-nav]").forEach(x=>x.setAttribute("aria-current",String(x.dataset.nav===({scene:"shows",chunk:"phrases"}[S.view]||S.view))));
  const wb=$("#wordsBtn");wb.classList.toggle("on",P.words);wb.setAttribute("aria-pressed",String(P.words));}
function showStage(title,back){$("#stage").hidden=false;$("#pTitle").textContent=title;$("#pBack").onclick=back;loadYT();}
function render(){renderNav();const v=$("#view");
  if(!["scene","review","chunk"].includes(S.view))$("#stage").hidden=true;
  ({today:vToday,shows:vShows,scene:vScene,phrases:vPhrases,chunk:vChunk,review:vReview,grown:vGrown}[S.view]||vToday)(v);}
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{sfx("tap");go(b.dataset.nav);});
$("#wordsBtn").onclick=()=>{P.words=!P.words;save();renderNav();rerenderCurrent();};
function rerenderCurrent(){if(S.view==="scene"||S.view==="review"){toast(P.words?"Words on: shown from the next card":"Words off");return;}if(G.redraw)G.redraw();else render();}

/* ================= shared task pieces ================= */
function rateHTML(){return`<div class="eyebrow">How did it go?</div><div class="rate">${STATES.map(s=>`<button data-rate="${s.k}"><span>${s.icon}</span>${s.label}</button>`).join("")}</div>`;}
function bindRate(box,id,after){box.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{const r=+b.dataset.rate;rate(id,r);sfx(r>=3?"star":r>=1?"right":"pop");if(r>=3)celebrate(r===4?"🌟":"🔁");after&&after(r);});}
function moveHTML(c){return`<div class="move"><span class="em">${esc(c.move[0])}</span><span>Do the move: ${esc(c.move[1])}</span></div>`;}
function stageFor(c,hasCheck){const st=Math.max(0,stOf(c.id));const out=[];if(hasCheck&&st<2)out.push("check");out.push("listen");if(st>=2&&c.frame)out.push("swap");if(st>=3)out.push("transfer");out.push("rate");return out;}

/* listen: original audio first, then move, then speak */
function taskListen(box,c,line,next){
  let n=0;
  const draw=()=>{box.innerHTML=`
    <span class="eyebrow">Listen</span>
    <span class="bigem"><span class="ava" id="lAva">${esc(c.emoji)}</span></span>
    ${W(line?line.text:say(c))}${ZH(c.zh)}
    <div class="dots">${[0,1,2].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>
    <div class="row center"><button class="btn sky big" id="lPlay">👂 Listen</button></div>
    ${n>=1?moveHTML(c):""}
    ${n>=2?`<h3>🗣️ Your turn! Say it with the move.</h3>`:`<p class="note">${n===0?"Just listen first.":"Listen again and do the move."}</p>`}
    <div class="row center"><button class="btn ${n>=2?"mint big":""}" id="lNext" ${n<1?"disabled":""}>Next ▶</button></div>`;
    $("#lPlay").onclick=()=>{const a=$("#lAva");a.classList.add("talking");
      const done=()=>{a&&a.classList.remove("talking");n=Math.min(3,n+1);draw();};
      if(line)playClip(line.v||G.v,line.s,line.e,done);else speak(say(c),{}).then(done);};
    $("#lNext").onclick=next;};
  draw();
}
function taskCheck(box,check,next){
  box.innerHTML=`<span class="eyebrow">What happened?</span>
    <button class="btn sky" id="cQ"><span class="ava" id="cAva">🦸</span> 🔊 Question</button>${W(check.q)}
    <div class="choices">${check.o.map((o,i)=>`<button class="sticker pic" data-o="${i}" aria-label="${esc(o[1])}">${esc(o[0])}</button>`).join("")}</div>`;
  const ask=()=>speak(check.q,{ava:$("#cAva")});$("#cQ").onclick=ask;ask();
  box.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o;
    if(i===check.a){b.classList.add("right");sfx("right");speak(check.o[i][1]);setTimeout(next,900);}
    else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");sfx("wrong");}});
}
function taskSwap(box,c,next){
  let pick=null;const f=c.frame;const parts=f.t.split("___");
  const draw=()=>{const o=pick!=null?f.o[pick]:null;box.innerHTML=`
    <span class="eyebrow">Make a new one</span>
    <div class="frame">${P.words?esc(parts[0].trim()):""} <span class="blank${o?" filled":""}">${o?esc(o.e):"❓"}</span> ${P.words?esc((parts[1]||"").trim()):""}</div>
    <div class="choices">${f.o.map((x,i)=>`<button class="sticker pic" data-p="${i}" aria-label="${esc(x.w)}" style="${pick===i?"background:var(--sun)":""}">${esc(x.e)}</button>`).join("")}</div>
    ${o?`<h3>🗣️ Now you say it!</h3><div class="row center"><button class="btn sky" id="sHear"><span class="ava" id="sAva">🦸</span> Hear it</button><button class="btn mint big" id="sNext">Next ▶</button></div>`:`<p class="note">Pick a picture.</p>`}`;
    box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick=+b.dataset.p;sfx("tap");draw();sayIt();});
    const sayIt=()=>{const x=f.o[pick];speak(parts[0]+x.w+(parts[1]||""),{ava:$("#sAva")});};
    const h=$("#sHear");if(h)h.onclick=sayIt;const nx=$("#sNext");if(nx)nx.onclick=next;};
  draw();
}
function taskTransfer(box,c,next){
  const s=c.sit&&c.sit.length?c.sit[Math.floor(Math.random()*c.sit.length)]:{q:"What do you say?",e:c.emoji};

  $("#tHint").onclick=()=>{const src=(SRC[c.id]||[])[0];if(src)playSource(src);else speak(say(c));};

function taskRate(box,c,next){
  box.innerHTML=`<span class="bigem">${esc(c.emoji)}</span>${W(say(c))}${rateHTML()}`;
  bindRate(box,c.id,()=>setTimeout(next,450));

/* run a list of stages for one chunk */
function runStages(box,c,stages,ctx,done){
  let i=0;const step=()=>{if(i>=stages.length){done&&done();return;}const k=stages[i++];
    if(k==="check")taskCheck(box,ctx.check,step);
    else if(k==="listen")taskListen(box,c,ctx.line,step);
    else if(k==="swap")taskSwap(box,c,step);
    else if(k==="transfer")taskTransfer(box,c,step);
    else taskRate(box,c,step);};
  step();
}

function videoIdOf(u){const m=String(u).match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(String(u).trim())?String(u).trim():null);}
function srtText(raw){return String(raw).replace(/\r/g,"").split(/\n\n+/).map(b=>{const l=b.split("\n").filter(Boolean);const ti=l.findIndex(x=>x.includes("-->"));if(ti<0)return"";
  const[a]=l[ti].split("-->");const tx=l.slice(ti+1).join(" ").trim();if(!tx||/^\[[^\]]*\]$/.test(tx)||/♪/.test(tx))return"";
  const m=a.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);const sec=m?(+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000):0;
  const e=l[ti].split("-->")[1].trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);const es=e?(+e[1]*3600+ +e[2]*60+ +e[3]+ +e[4]/1000):sec;
  return`${sec.toFixed(2)}-${es.toFixed(2)}|${tx}`;}).filter(Boolean).join("\n");}

    save();buildIndex();toast("Backup loaded ✓");render();}catch(err){toast("That file is not a Hero Words backup");}};r.readAsText(f);};
  let srt="";
  $("#srtFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{srt=srtText(r.result);toast(`Subtitles loaded: ${srt.split("\n").length} lines`);};r.readAsText(f);};
  const st=$("#st");
  $("#copyPrompt").onclick=async()=>{st.classList.remove("err");const vid=videoIdOf($("#ytUrl").value);
    if(!vid){st.textContent="Paste the YouTube link first.";st.classList.add("err");return;}
    if(!srt){st.textContent="Pick the .srt file first.";st.classList.add("err");return;}
    const text=genPrompt(vid,srt);
    try{await navigator.clipboard.writeText(text);st.textContent="Prompt copied. Paste it into Claude.";}catch(e){$("#jsonIn").value=text;$("#jsonIn").select();st.textContent="Copy the text in the box, then clear it and paste Claude's answer.";}};
  $("#addShow").onclick=()=>{st.classList.remove("err");
    let raw=$("#jsonIn").value.trim();const fence=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)raw=fence[1];
    try{const d=JSON.parse(raw.slice(raw.indexOf("{"),raw.lastIndexOf("}")+1));const r=importPack(d);
      st.textContent=`Added “${r.title}”: ${r.scenes} scenes, ${r.newChunks} new phrases.`;celebrate("🎬");setTimeout(()=>go("shows"),900);}
    catch(e){st.textContent="That answer couldn't be read: "+(e.message||"check the JSON")+".";st.classList.add("err");}};
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(G.del!==id){G.del=id;vGrown(v);return;}
    CUSTOM.episodes=CUSTOM.episodes.filter(e=>e.id!==id);save();buildIndex();G.del=null;vGrown(v);});
}
function importPack(d){
  const ep=d.episode;if(!ep||!Array.isArray(ep.scenes)||!ep.scenes.length)throw new Error("no scenes");
  const vid=videoIdOf(ep.videoId||ep.id)||videoIdOf($("#ytUrl").value);if(!vid)throw new Error("missing video id");
  const num=x=>{const n=+x;if(!Number.isFinite(n))throw new Error("bad time");return n;};const str=x=>String(x??"");
  let newC=0;
  for(const c of (d.chunks||[])){if(!c||!c.id||!c.en||CH[c.id])continue;
    CUSTOM.chunks.push({id:str(c.id).replace(/[^a-z0-9-]/gi,"-").toLowerCase(),m:MODULES.some(m=>m.id===c.m)?c.m:"play",lv:+c.lv||1,en:str(c.en),ex:c.ex?str(c.ex):undefined,zh:str(c.zh),emoji:str(c.emoji)||"💬",
      move:Array.isArray(c.move)?[str(c.move[0])||"👋",str(c.move[1])]:["👋","Make a big gesture"],home:str(c.home),sit:(c.sit||[]).map(s=>({q:str(s.q),e:str(s.e)||"🤔"})),
      frame:c.frame&&c.frame.t&&String(c.frame.t).includes("___")&&Array.isArray(c.frame.o)?{t:str(c.frame.t),o:c.frame.o.map(o=>({w:str(o.w),e:str(o.e)||"⭐"}))}:undefined});newC++;}
  buildIndex();
  const scenes=ep.scenes.map((sc,i)=>({id:"s"+(i+1),title:str(sc.title)||"Scene "+(i+1),emoji:str(sc.emoji)||"🎬",start:num(sc.start),end:num(sc.end),
    stops:(sc.stops||[]).map(st=>({at:num(st.at),note:st.note?str(st.note):undefined,
      check:st.check&&Array.isArray(st.check.o)&&st.check.o.length>1?{q:str(st.check.q),o:st.check.o.map(o=>[str(o[0]),str(o[1])]),a:+st.check.a||0}:undefined,
      lines:(st.lines||[]).filter(l=>l&&CH[l.c]).map(l=>({c:str(l.c),s:num(l.s),e:num(l.e),who:str(l.who),text:str(l.text)}))})).filter(st=>st.lines.length).sort((a,b)=>a.at-b.at)})).filter(sc=>sc.stops.length);
  if(!scenes.length)throw new Error("no usable scenes");
  CUSTOM.episodes=CUSTOM.episodes.filter(e=>e.id!==vid);CUSTOM.episodes.push({id:vid,videoId:vid,title:str(ep.title)||"New show",scenes});
  save();buildIndex();return{title:str(ep.title)||"New show",scenes:scenes.length,newChunks:newC};
}

/* ================= boot ================= */
load();buildIndex();render();
</script>
